name: Leadstate Incorporated
description: Leadstate Incorporated is a New York City based real estate and design technology company,
  founded in 2021 and backed by 500 Global, that builds AI and AR tooling for how spaces are planned,
  developed, designed, and marketed. Its consumer-facing products are ReelProp, which turns static
  property photography and interior design sketches into marketing video reels, and RealMe In, which
  generates and manipulates 3D assets. The published product surface covers Photo-to-Video and
  Sketch-to-Video generation, CADgpt text-to-3D model generation, Image-to-3D asset conversion, and
  FloorPlan-to-3D visualization. As of this enrichment pass the company publishes no public developer
  portal, API reference, OpenAPI definition, SDK, or machine-readable developer surface of any kind,
  so this profile records verified company identity and web properties only.
